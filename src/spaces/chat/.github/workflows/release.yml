# GitHub Actions release workflow for Construct spaces.
# Copy this to .github/workflows/release.yml in your space repo,
# then replace SPACE_ID / DISPLAY_NAME / DESCRIPTION / ICON / SCOPE placeholders.
#
# Triggered by pushing a version tag: git tag v0.2.0 && git push origin v0.2.0

name: Release Space

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read manifest
        id: manifest
        run: |
          if [ -f space.manifest.json ]; then
            echo "id=$(jq -r '.id' space.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "name=$(jq -r '.name' space.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "description=$(jq -r '.description' space.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "icon=$(jq -r '.icon' space.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "scope=$(jq -r '.scope // "both"' space.manifest.json)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::space.manifest.json not found"
            exit 1
          fi

      - name: Create source tarball
        run: |
          SPACE_ID="${{ steps.manifest.outputs.id }}"
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="space-${SPACE_ID}-v${VERSION}.tar.gz"

          # Package everything except .git, node_modules, dist, and the tarball itself
          tar -czf "/tmp/${TARBALL}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.DS_Store' \
            --exclude='*.tar.gz' \
            .
          mv "/tmp/${TARBALL}" .



          echo "tarball=${TARBALL}" >> "$GITHUB_ENV"
          ls -lh "${TARBALL}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${tarball}" \
            --title "${{ steps.manifest.outputs.name }} ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Dispatch to space-releases
        env:
          GH_TOKEN: ${{ secrets.SPACE_RELEASES_TOKEN }}
        run: |
          gh api repos/construct-base/space-releases/dispatches \
            --method POST \
            --field event_type=space-release \
            -f "client_payload[space]=${{ steps.manifest.outputs.id }}" \
            -f "client_payload[version]=${{ steps.version.outputs.version }}" \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[display_name]=${{ steps.manifest.outputs.name }}" \
            -f "client_payload[description]=${{ steps.manifest.outputs.description }}" \
            -f "client_payload[icon]=${{ steps.manifest.outputs.icon }}" \
            -f "client_payload[scope]=${{ steps.manifest.outputs.scope }}" \
            -f "client_payload[tarball_url]=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${tarball}"
